# Tudo roda dentro do bingus.slice (teto de 32 GB e 16 CPUs na máquina compartilhada). Sem o slice
# instalado o systemd cria um vazio, sem teto. Os limites por serviço somam mais que o teto de
# propósito: o slice é o limite real, eles só impedem um serviço de engolir os outros.
services:
  postgres:
    image: tensorchord/vchord-suite:pg18-latest
    env_file: .env
    restart: unless-stopped
    cgroup_parent: bingus.slice
    mem_limit: 20g
    shm_size: 2g
    # O checkpoint de desligamento passa dos 10 s padrão, e o SIGKILL força recuperação do WAL na
    # subida. No reboot da máquina quem manda é o TimeoutStopSec do user@.service, ver a skill.
    stop_grace_period: 2m
    command:
      - postgres
      - -c
      - shared_preload_libraries=vchord.so,pg_tokenizer.so,vchord_bm25.so
      - -c
      - search_path="$$user",public,bm25_catalog
      - -c
      - default_toast_compression=lz4
      - -c
      - wal_compression=lz4
      - -c
      - shared_buffers=8GB
      - -c
      - effective_cache_size=20GB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - work_mem=64MB
      - -c
      # Pouco WAL entre checkpoints: depois de uma queda, com 30 min e 4 GB a subida levou 7 min
      # (169 s de redo e 264 s do checkpoint de fim de recuperação, quase tudo fsync no HD).
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=5min
      # Uma queda perde os últimos segundos de ingestão, que o crawler refaz. Nunca corrompe.
      - -c
      - synchronous_commit=off
    ports:
      - "${BINGUS_PG_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - ${BINGUS_PG_DATA:-pgdata}:/var/lib/postgresql
      # Tablespace hdd: só a tabela texts, que a busca lê para 10 a 20 resultados. Ver schema.sql.
      - ${BINGUS_PG_TABLESPACE:-pgtablespace}:/tablespace
      - ./bingus/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3m  # initdb com o schema leva mais que os 50 s das tentativas

  api:
    image: shiftsad/bingus:api
    build:
      context: ./bingus
      args:
        EXTRA: api
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
    restart: unless-stopped
    cgroup_parent: bingus.slice
    mem_limit: 14g  # bingus-rank roda aqui dentro e chega a uns 12 GB com 10 milhões de páginas
    command: bingus-api
    ports:
      - "${BINGUS_API_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - ${BINGUS_DATA:-./data}:/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.shiftsad.dev}
    restart: unless-stopped
    cgroup_parent: bingus.slice
    mem_limit: 256m
    ports:
      - "${BINGUS_WEB_BIND:-127.0.0.1:8080}:80"

  # Dashboard de grafana/bingus.json, lendo o Postgres com o usuário só de leitura grafana.
  grafana:
    image: grafana/grafana-oss:12.4.3
    restart: unless-stopped
    cgroup_parent: bingus.slice
    mem_limit: 512m
    environment:
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # só alcançável pela WireGuard: ver sem login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bingus.json
    ports:
      - "${BINGUS_GRAFANA_BIND:-127.0.0.1:3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/bingus.json:/var/lib/grafana/dashboards/bingus.json:ro
      - grafana:/var/lib/grafana
    depends_on: [postgres]

  # GET /metrics da API para o Prometheus central da máquina, ver alloy/config.alloy. A chave
  # também entra em BINGUS_API_KEYS. Sem depends_on, para o up dele nunca recriar a API.
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    cgroup_parent: bingus.slice
    mem_limit: 256m
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    environment:
      BINGUS_METRICS_KEY: ${BINGUS_METRICS_KEY}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy:/var/lib/alloy/data

  # Workers na mesma máquina: docker compose --profile workers up -d
  fetch:
    image: shiftsad/bingus:fetch
    build:
      context: ./bingus
      args:
        EXTRA: fetch
    profiles: ["workers"]
    restart: unless-stopped
    cgroup_parent: bingus.slice
    mem_limit: 2g
    stop_grace_period: 30s  # envia o que está pronto e devolve os hosts em voo
    command: bingus-fetch
    environment:
      PYTHONUNBUFFERED: 1
      BINGUS_API_URL: http://api:8000
      BINGUS_API_KEY: ${BINGUS_FETCH_KEY}
      BINGUS_HOSTS: ${BINGUS_FETCH_HOSTS:-20}
    deploy:
      replicas: ${BINGUS_FETCH_REPLICAS:-1}
    depends_on: [api]

  embed:
    image: shiftsad/bingus:embed
    build:
      context: ./bingus
      args:
        EXTRA: embed
    profiles: ["workers"]
    restart: unless-stopped
    cgroup_parent: bingus.slice
    mem_limit: 8g
    command: bingus-embed
    environment:
      PYTHONUNBUFFERED: 1
      BINGUS_API_URL: http://api:8000
      BINGUS_API_KEY: ${BINGUS_EMBED_KEY}
      BINGUS_EMBED_BATCH: ${BINGUS_EMBED_BATCH:-8}
      BINGUS_EMBED_TOKENS: ${BINGUS_EMBED_TOKENS:-512}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      BINGUS_EMBED_LEASE: ${BINGUS_EMBED_LEASE:-256}
    expose:
      - "8100"
    volumes:
      - ${BINGUS_HF_CACHE:-hf_cache}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on: [api]

  # LLM local dos resumos e do "perguntar à página": llama.cpp com o Gemma 4 E2B Q4 na GPU do embed.
  # O GGUF fica em BINGUS_LLM_MODELS. A API fala com ele com OPENROUTER_BASE_URL=http://llm:8080/v1,
  # OPENROUTER_KEY=local (qualquer valor) e BINGUS_LLM_CHARS=4000 no .env.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: ["workers"]
    restart: unless-stopped
    cgroup_parent: bingus.slice
    mem_limit: 6g
    command: >
      -m /models/${BINGUS_LLM_FILE:-gemma-4-E2B_q4_0-it.gguf} -ngl 99 -c 8192 --parallel 1
      --reasoning-budget 0 --host 0.0.0.0 --port 8080
    expose:
      - "8080"
    volumes:
      - ${BINGUS_LLM_MODELS:-./data/llm}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  pgtablespace:
  hf_cache:
  grafana:
  alloy:
