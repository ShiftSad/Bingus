<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingus</title>
    <meta name="description" content="Buscador da internet brasileira, em português, com foco em tech. Também como MCP para agentes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Poppins:wght@600&display=swap">
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/main.ts"></script>
    <style>
        body { position: relative; overflow: hidden; }
        #fire { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .home-top { position: relative; padding: 10px var(--pad); display: flex; justify-content: flex-end; }
        .home-top .lnk { font-size: 14.5px; font-weight: 500; color: var(--body); }
        .home-main {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px var(--pad) 120px;
        }
        .home-col { width: 100%; max-width: 680px; display: flex; flex-direction: column; align-items: center; gap: 36px; }
        .home-col .logo { font-size: clamp(2.5rem, 2rem + 1.8vw, 3.25rem); color: #ff3b2f; }
        .home-form { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .home-form .field { width: 100%; min-height: 60px; padding: 0 8px 0 22px; }
        .home-form .q { font-size: 17px; }
        .home-form .lucky { padding: 0 12px; font-size: 13.5px; }
        @media (max-width: 480px) { .home-form .field > svg { display: none; } }
        .promo {
            width: 100%;
            box-sizing: border-box;
            margin-top: 24px;
            padding: 12px 12px 12px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 20px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
        }
        .promo div { flex: 999 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .promo b { font-size: 14px; font-weight: 600; }
        .promo span { font-size: 13.5px; color: var(--body); }
    </style>
</head>
<body>
    <canvas id="fire" aria-hidden="true"></canvas>
    <header class="home-top">
        <a class="lnk" href="/mcp">Conectar via MCP</a>
    </header>
    <main class="home-main">
        <div class="home-col">
            <h1 class="logo">bingus<span class="dim">.sh</span></h1>
            <form class="home-form" id="search-form" action="/search" method="GET">
                <div class="field" id="field" role="search">
                    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; color: var(--faint)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
                    <label class="vh" for="q">Buscar no Bingus</label>
                    <input id="q" class="q" name="q" type="search" placeholder="Busque em tech, em português" autocomplete="off" required autofocus>
                    <button id="mic" class="ico" type="button" aria-label="Buscar por voz" hidden>
                        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
                    </button>
                    <button class="cta" type="submit">Buscar</button>
                </div>
                <button class="lnk lucky" type="submit" name="sorte" value="1">Estou com sorte</button>
            </form>
            <div class="promo">
                <div>
                    <b>Bingus no seu agente</b>
                    <span>Conecte via MCP e a sua IA passa a buscar em tech por conta própria.</span>
                </div>
                <a class="ghost" href="/mcp">Conectar</a>
            </div>
        </div>
    </main>
</body>
</html>
