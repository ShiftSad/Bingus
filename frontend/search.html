<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@600&display=swap">
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/search.ts"></script>
    <style>
        .switch {
            min-height: 44px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: 0;
            color: var(--ink);
            font: inherit;
            font-size: 14px;
            cursor: pointer;
        }
        .track {
            box-sizing: border-box;
            width: 36px;
            height: 20px;
            padding: 2px;
            display: inline-flex;
            border-radius: 999px;
            background: var(--off);
            transition: background-color .15s ease-out;
        }
        .knob { width: 16px; height: 16px; border-radius: 999px; background: #ffffff; transition: transform .15s ease-out; }
        .switch[aria-checked="true"] .track { background: var(--ac); }
        .switch[aria-checked="true"] .knob { background: var(--on-ac); transform: translateX(16px); }

        .wrap {
            padding: 20px var(--pad) 72px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 24px;
        }
        .col { flex: 999 1 420px; min-width: 0; max-width: 680px; display: flex; flex-direction: column; gap: 30px; }
        .status { margin: 0 0 -8px; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
        .status b { color: var(--ink); font-weight: 600; }
        #results { display: flex; flex-direction: column; gap: 30px; }
        #results:empty { display: none; }
        #more { margin: 0; font-size: 13px; color: var(--faint); text-align: center; }
        #more:empty { display: none; }

        article { display: flex; flex-direction: column; gap: 6px; }
        .src { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .initial {
            flex: none;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: var(--surface);
            font-size: 12px;
            font-weight: 600;
            color: var(--body);
            text-transform: uppercase;
        }
        .src div { min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
        .host { font-size: 14px; }
        .crumb { font-size: 12.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        article h2 { margin: 2px 0 0; font-size: 20px; font-weight: 400; line-height: 1.3; }
        article h2 a { color: var(--link); text-decoration: none; }
        article h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
        .text { margin: 0; font-size: 14.5px; line-height: 1.58; color: var(--body); text-wrap: pretty; }
        .text b { margin-right: 8px; font-weight: 600; color: var(--ink); }
        .no-sum .sum, body:not(.no-sum) .alt { display: none; }
        .foot-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 16px; }
        .meta { font-size: 12px; color: var(--faint); }
        .foot-line .lnk { font-size: 13px; font-weight: 500; color: var(--body); }
        .ask { min-height: 50px; padding: 0 4px 0 20px; gap: 8px; }
        .ask .q { font-size: 14.5px; }
        .ask .cta { min-height: 42px; padding: 0 18px; font-size: 13.5px; }

        .timings {
            flex: 1 1 260px;
            min-width: 0;
            max-width: 340px;
            margin-left: auto;
            box-sizing: border-box;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: var(--surface);
            border-radius: 16px;
        }
        .timings h2 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.4; }
        .total { display: block; margin-top: 2px; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
        .timings dl { margin: 0; display: flex; flex-direction: column; font-size: 12.5px; line-height: 1.4; }
        .timings dl div { padding: 8px 0; border-top: 1px solid var(--line2); display: flex; justify-content: space-between; gap: 16px; }
        .timings dt { color: var(--body); }
        .timings dd { margin: 0; white-space: nowrap; }
    </style>
</head>
<body>
    <header class="bar">
        <div class="bar-in">
            <a class="logo" href="/" aria-label="Bingus, página inicial">bingus<span class="dim">.sh</span></a>
            <form id="search-form" class="field" role="search" action="/search">
                <label class="vh" for="search-input">Buscar no Bingus</label>
                <input id="search-input" class="q" name="q" type="search" autocomplete="off">
                <button id="mic" class="ico" type="button" aria-label="Buscar por voz" hidden>
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
                </button>
                <button class="ico" type="submit" aria-label="Buscar" style="color: var(--ink)">
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
                </button>
            </form>
            <button id="summaries" class="switch end" type="button" role="switch" aria-checked="true">
                <span class="track" aria-hidden="true"><span class="knob"></span></span>
                Resumos
            </button>
        </div>
    </header>
    <main>
        <div class="wrap">
            <div class="gutter" aria-hidden="true"></div>
            <div class="col">
                <p id="status" class="status" aria-live="polite">Buscando…</p>
                <div id="results"></div>
                <p id="more"></p>
            </div>
            <aside id="timings" class="timings" aria-label="Tempo da busca" hidden>
                <div>
                    <h2>Como essa busca rodou</h2>
                    <span id="total" class="total mono"></span>
                </div>
                <dl id="steps" class="mono"></dl>
            </aside>
        </div>
    </main>
    <footer class="foot">
        <div class="foot-in">
            <div class="gutter" aria-hidden="true"></div>
            <a class="lnk" href="/mcp">Conectar via MCP</a>
        </div>
    </footer>
</body>
</html>
