<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingus · importação da Wikipédia</title>
    <script type="module" src="/src/seed.ts"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 1000px">
        <h1 class="h3 mb-3">Importação da Wikipédia</h1>
        <div id="status" class="text-muted mb-3">Carregando...</div>
        <div class="progress mb-3" style="height: 28px">
            <div id="bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%">0%</div>
        </div>
        <div id="cards" class="row g-3 mb-4"></div>
        <h2 class="h5">Últimos artigos importados</h2>
        <table class="table table-sm table-hover bg-white">
            <thead><tr><th>Título</th><th>URL</th><th class="text-end">Caracteres</th><th>Quando</th></tr></thead>
            <tbody id="recent"></tbody>
        </table>
    </div>
</body>
</html>
